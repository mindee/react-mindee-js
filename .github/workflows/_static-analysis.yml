name: Static Analysis

on:
  workflow_call:

permissions:
  contents: read

jobs:
  static-check:
    name: Run Static Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Check out Git repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Run Betterleaks
        id: betterleaks
        continue-on-error: true
        uses: dortort/betterleaks-action@v0.1.0
        with:
          version: 'v1.9.0'
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Betterleaks report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: betterleaks-report
          path: betterleaks-report.sarif
          if-no-files-found: warn

      - name: Fail if Betterleaks found leaks
        if: steps.betterleaks.outcome == 'failure'
        run: exit 1

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install Node.js dependencies
        run: pnpm install --frozen-lockfile

      - name: Run static analysis
        # Betterleaks already ran above with a SARIF report; skip the prek hook.
        run: pnpm exec prek run --all-files --skip betterleaks

      - name: Lint
        run: pnpm lint
