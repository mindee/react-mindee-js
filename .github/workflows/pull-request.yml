name: Pull Request

on:
  pull_request:

permissions:
  contents: read
  pull-requests: read

jobs:
  workflow_lint:
    uses: ./.github/workflows/_workflow-lint.yml
  static_analysis:
    uses: ./.github/workflows/_static-analysis.yml
    needs: workflow_lint
  test_components:
    uses: ./.github/workflows/_test-components.yml
    needs: static_analysis
    secrets: inherit
  test_integration:
    uses: ./.github/workflows/_test-integration.yml
    needs: static_analysis
    secrets: inherit
