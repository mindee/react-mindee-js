# Paths ignored by eslint.config.ts / .prettierignore; keep in sync.
exclude = "^(docs|dist|node_modules|cypress/snapshots)/"

[[repos]]
repo = "local"

[[repos.hooks]]
id = "typecheck"
name = "Typecheck"
entry = "pnpm exec tsc --noEmit"
language = "system"
pass_filenames = false
types_or = ["ts", "tsx"]

[[repos.hooks]]
id = "eslint-fix"
name = "ESLint Fix"
entry = "pnpm exec eslint --fix --max-warnings 0"
language = "system"
types_or = ["ts", "tsx"]

[[repos.hooks]]
id = "prettier"
name = "Prettier"
entry = "pnpm exec prettier --write --ignore-unknown"
language = "system"

[[repos]]
repo = "https://github.com/betterleaks/betterleaks"
rev = "v1.9.0"
hooks = [
    { id = "betterleaks" }
]
